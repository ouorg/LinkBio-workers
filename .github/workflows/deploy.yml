# LinkBio-workers — Next.js (OpenNext) → Cloudflare Workers
#
# Secrets: CF_API_TOKEN / CF_ACCOUNT_ID (or CLOUDFLARE_*)
# Vars/Secrets: BIO_KV_ID (required), BIO_KV_PREVIEW_ID (optional)
# Worker secrets (Dashboard/CLI): ADMIN_PASSWORD, SESSION_SECRET

name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Inject KV namespace IDs into wrangler.toml
        env:
          BIO_KV_ID: ${{ vars.BIO_KV_ID || secrets.BIO_KV_ID }}
          BIO_KV_PREVIEW_ID: ${{ vars.BIO_KV_PREVIEW_ID || secrets.BIO_KV_PREVIEW_ID || vars.BIO_KV_ID || secrets.BIO_KV_ID }}
        run: |
          set -euo pipefail
          if [ -z "${BIO_KV_ID:-}" ] || [ "$BIO_KV_ID" = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID" ]; then
            echo "::error::BIO_KV_ID is required."
            exit 1
          fi
          export BIO_KV_PREVIEW_ID="${BIO_KV_PREVIEW_ID:-$BIO_KV_ID}"
          node -e '
            const fs = require("fs");
            const id = process.env.BIO_KV_ID;
            const preview = process.env.BIO_KV_PREVIEW_ID || id;
            let toml = fs.readFileSync("wrangler.toml", "utf8");
            toml = toml
              .split("REPLACE_WITH_YOUR_KV_NAMESPACE_ID").join(id)
              .split("REPLACE_WITH_YOUR_KV_PREVIEW_ID").join(preview);
            if (toml.includes("REPLACE_WITH_YOUR_KV_")) process.exit(1);
            fs.writeFileSync("wrangler.toml", toml);
            console.log("Injected BIO_KV_ID");
          '

      - name: Build OpenNext worker
        run: npx opennextjs-cloudflare build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
